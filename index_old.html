<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mialogic Studios</title>
  <meta name="description" content="Mialogic Studios - Official website and home of independent game development. Coming soon.">
  <meta name="robots" content="index, follow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      /* Allows pull-to-refresh overscroll */
      overscroll-behavior-y: auto;
      background-color: #000;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* min-height ensures mobile browsers recognize a scrollable root canvas */
      min-height: calc(100vh + 1px);
      background: #000 url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Center image container */
    .card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90vw;
      padding: 24px;
      margin: auto; /* Keeps it centered vertically & horizontally */
    }

    .foreground-img {
      max-width: 100%;
      max-height: 60vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* Social Icons Row */
    .social-links {
      display: flex;
      gap: 40px;
      margin-top: 36px;
      align-items: center;
      justify-content: center;
    }

    .social-link {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-link:hover {
      color: #ffffff;
      transform: translateY(-4px) scale(1.1);
    }

    .social-link svg {
      width: 56px;
      height: 56px;
      fill: currentColor;
    }

    @media (max-width: 600px) {
      .social-links {
        gap: 24px;
        margin-top: 24px;
      }
      .social-link svg {
        width: 42px;
        height: 42px;
      }
      .foreground-img {
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>

  <main class="card-container">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">
      Mialogic Studios - Indie Game Development Studio
    </h1>
    <!-- Foreground art / logo -->
    <img class="foreground-img" src="coming_soon.png" alt="Mialogic Studios">

    <!-- Clickable Social Icons -->
    <div class="social-links">
      <!-- X (Twitter) -->
      <a href="https://x.com/MialogicStudios" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="X (Twitter)">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/mialogicstudios" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>

      <!-- Facebook -->
      <a href="https://www.facebook.com/mialogicstudios" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </a>
    </div>
  </main>

</body>
</html>
