<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mialogic Studios - The Crash</title>
  <meta name="description" content="The Crash - A complete offline match 3 survival game by Mialogic Studios. Play anytime, anywhere.">
  
  <!-- Fantasy & Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;600;700;800&family=Rubik:wght@800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-bright: #ffc44d;
      --gold-dark: #b87a14;
      --fire-orange: #ff5500;
      --fire-glow: rgba(255, 94, 0, 0.65);
      --ice-blue: #00d2ff;
      --stone-dark: #0a0e14;
      --border-metallic: #546274;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      overflow-x: hidden;
      background-color: #04070c;
    }

    body {
      background-color: #04070c;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ================= 1. TOP NAVBAR ================= */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 60px;
      background: linear-gradient(180deg, rgba(3, 6, 12, 0.95) 0%, rgba(3, 6, 12, 0.6) 65%, transparent 100%);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      transition: transform 0.25s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    /* Increased Logo Dimensions */
    .brand-logo-img {
      height: 110px;
      width: auto;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0, 180, 255, 0.55));
    }

    .nav-links {
      display: flex;
      gap: 34px;
      list-style: none;
    }

    .nav-item a {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: #cad5e2;
      text-decoration: none;
      position: relative;
      padding-bottom: 6px;
      transition: color 0.3s ease;
    }

    .nav-item a:hover,
    .nav-item.active a {
      color: #ffc247;
      text-shadow: 0 0 10px rgba(255, 194, 71, 0.6);
    }

    .nav-item.active a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #ffb700, transparent);
      box-shadow: 0 0 8px #ffb700;
    }

    /* ================= 2. HERO SECTION ================= */
    .hero-section {
      position: relative;
      min-height: 720px;
      display: flex;
      align-items: center;
      /* Increased top padding to accommodate the larger logo */
      padding: 160px 60px 80px;
      background: 
        radial-gradient(circle at 75% 45%, rgba(255, 90, 0, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(130, 200, 255, 0.2) 0%, transparent 45%),
        linear-gradient(90deg, rgba(3, 6, 12, 0.95) 0%, rgba(3, 6, 12, 0.8) 45%, rgba(3, 6, 12, 0.25) 85%),
        url('hero_the_crash.jpg') center right / cover no-repeat;
    }

    .hero-container {
      max-width: 620px;
      z-index: 5;
    }

    /* "OUT NOW" Badge */
    .out-now-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffbe42;
      text-shadow: 0 0 12px rgba(255, 174, 0, 0.7);
      margin-bottom: 10px;
    }

    .badge-line {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffbe42);
      position: relative;
    }
    .badge-line.right {
      background: linear-gradient(90deg, #ffbe42, transparent);
    }
    .badge-diamond {
      font-size: 0.85rem;
    }

    /* "THE CRASH" Chiseled Stone Title */
    .main-game-title {
      font-family: 'Rubik', 'Cinzel', sans-serif;
      font-size: clamp(2.6rem, 7.5vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 20px;
      color: #f1f3f7;
      text-shadow: 
        0 2px 0 #9ca3af,
        0 4px 0 #6b7280,
        0 6px 0 #4b5563,
        0 8px 12px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(255, 255, 255, 0.2);
      word-break: keep-all;
    }

    /* Subtext features */
    .game-features {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #d1d5db;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      margin-bottom: 34px;
      font-weight: 600;
    }

    .highlight-gold {
      color: #ffb72b;
      font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 183, 43, 0.4);
    }

    /* Fiery Android CTA Button */
    .btn-android {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      padding: 16px 36px;
      font-family: 'Cinzel', serif;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(180deg, #1f140e 0%, #0d0703 100%);
      border: 2px solid #ff7700;
      border-radius: 40px;
      position: relative;
      box-shadow: 
        0 0 22px var(--fire-glow),
        inset 0 0 14px rgba(255, 120, 0, 0.5);
      transition: all 0.25s ease;
    }

    .btn-android::before {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 36px;
      border: 1px solid rgba(255, 200, 100, 0.4);
      pointer-events: none;
    }

    .btn-android:hover {
      transform: translateY(-2px) scale(1.02);
      border-color: #ffa233;
      box-shadow: 
        0 0 35px rgba(255, 110, 0, 0.9),
        inset 0 0 20px rgba(255, 170, 0, 0.8);
      color: #fff9e6;
    }

    .btn-android:active {
      transform: scale(0.97);
    }

    .android-icon {
      width: 25px;
      height: 25px;
      fill: #ffffff;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
      flex-shrink: 0;
    }

    /* ================= 3. ORNATE FANTASY DIVIDER ================= */
    .fantasy-divider {
      position: relative;
      width: 100%;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #101621 0%, #2b394f 50%, #101621 100%);
      border-top: 2px solid #485c7b;
      border-bottom: 2px solid #1c2738;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      z-index: 20;
    }

    .divider-gem-center {
      position: absolute;
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 35% 35%, #ffe17d 0%, #ff6a00 55%, #7a1f00 100%);
      transform: rotate(45deg);
      border: 2px solid #ffbe42;
      box-shadow: 
        0 0 16px rgba(255, 106, 0, 0.9),
        0 0 4px #fff;
      z-index: 25;
    }

    .divider-gem-left,
    .divider-gem-right {
      position: absolute;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 35%, #b5f5ff 0%, #0099ff 60%, #002e6b 100%);
      transform: rotate(45deg);
      border: 2px solid #7de7ff;
      box-shadow: 0 0 12px rgba(0, 180, 255, 0.8);
    }
    .divider-gem-left { left: 16px; }
    .divider-gem-right { right: 16px; }

    /* ================= 4. OUR GAMES / EMBER SECTION ================= */
    .games-section {
      position: relative;
      flex-grow: 1;
      padding: 60px 40px 90px;
      background: 
        radial-gradient(circle at 50% 30%, rgba(18, 25, 38, 0.6) 0%, rgba(4, 7, 12, 0.98) 100%),
        radial-gradient(circle at 20% 80%, rgba(255, 70, 0, 0.08) 0%, transparent 40%),
        linear-gradient(rgba(4, 7, 12, 0.85), rgba(4, 7, 12, 0.95)),
        url('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #ember-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* "OUR GAMES" Title */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 5px;
      color: #dbe4ef;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 45px;
      text-shadow: 0 0 12px rgba(180, 215, 255, 0.4);
      z-index: 5;
    }

    .title-flourish {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #748ba7);
      position: relative;
    }
    .title-flourish.right {
      background: linear-gradient(90deg, #748ba7, transparent);
    }

    /* Game Showcase Card */
    .game-showcase-container {
      width: 100%;
      max-width: 560px;
      z-index: 5;
      margin-right: auto;
      margin-left: 5vw;
    }

    .game-framed-card {
      position: relative;
      background: #090e17;
      border: 3px solid #5a4b37;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(255, 140, 0, 0.15);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .game-framed-card:hover {
      transform: translateY(-5px);
      border-color: #d19a3b;
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(255, 160, 0, 0.35);
    }

    .game-framed-card:active {
      transform: scale(0.98);
    }

    .card-inner-art {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #111827;
    }

    .card-inner-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #dfb052;
      z-index: 6;
      pointer-events: none;
    }
    .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* ================= 5. FOOTER SOCIAL ICONS ================= */
    .social-dock {
      position: absolute;
      bottom: 28px;
      right: 40px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      background: rgba(10, 15, 24, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .social-btn:hover {
      border-color: #ffb700;
      color: #ffb700;
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 0 14px rgba(255, 183, 0, 0.6);
    }

    .social-btn:active {
      transform: scale(0.92);
    }

    /* ================= RESPONSIVE / MOBILE ENHANCEMENTS ================= */
    @media (max-width: 900px) {
      .navbar {
        padding: 14px 24px;
      }
      .game-showcase-container {
        margin: 0 auto;
      }
      .social-dock {
        position: static;
        margin-top: 50px;
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 12px 20px;
      }
      .brand-logo-img {
        height: 84px;
      }
      .nav-links {
        gap: 16px;
      }
      .nav-item a {
        font-size: 0.8rem;
        letter-spacing: 1.5px;
      }

      .hero-section {
        min-height: 85vh;
        min-height: 85dvh;
        padding: 145px 20px 60px;
        background-position: 70% center;
        text-align: center;
        justify-content: center;
      }

      .hero-section::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(3, 6, 12, 0.68) 0%, rgba(3, 6, 12, 0.92) 85%);
        pointer-events: none;
        z-index: 2;
      }

      .hero-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .main-game-title {
        font-size: clamp(2.3rem, 11.5vw, 3.8rem);
        letter-spacing: 2px;
        margin-bottom: 16px;
      }

      .game-features {
        font-size: 1.02rem;
        line-height: 1.6;
        margin-bottom: 28px;
        max-width: 420px;
      }

      .btn-android {
        width: 100%;
        max-width: 320px;
        justify-content: center;
        padding: 15px 20px;
        font-size: 1rem;
      }

      .games-section {
        padding: 50px 18px 70px;
      }

      .section-title {
        font-size: 1.45rem;
        letter-spacing: 3px;
        gap: 10px;
        margin-bottom: 35px;
      }

      .title-flourish {
        width: 25px;
      }

      .social-dock {
        margin-top: 40px;
        gap: 18px;
        padding-bottom: env(safe-area-inset-bottom, 15px);
      }
    }

    @media (max-width: 420px) {
      .navbar {
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
      }
      .brand-logo-img {
        height: 74px;
      }
      .hero-section {
        padding-top: 175px;
      }
      .main-game-title {
        font-size: 2.1rem;
      }
      .game-features {
        font-size: 0.92rem;
      }
      .out-now-badge {
        font-size: 0.92rem;
      }
      .badge-line {
        width: 24px;
      }
      .social-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">

        <div class="card-inner-art">
          <img src="hero_the_crash.jpg" alt="The Crash - Offline Match 3">

  <!-- Optimized Floating Embers Script -->
  <script>
    const canvas = document.getElementById('ember-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    const isMobile = window.innerWidth < 768;
    const particleCount = isMobile ? 20 : 45;

    function resize() {
      width = canvas.width = canvas.parentElement.offsetWidth;
      height = canvas.height = canvas.parentElement.offsetHeight;
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 1,
        speedY: -(Math.random() * 0.7 + 0.3),
        speedX: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.8 + 0.2,
        fadeSpeed: Math.random() * 0.007 + 0.003
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.opacity -= p.fadeSpeed;

        if (p.opacity <= 0 || p.y < 0) {
          p.x = Math.random() * width;
          p.y = height + 10;
          p.opacity = Math.random() * 0.8 + 0.2;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${Math.floor(100 + Math.random() * 70)}, 0, ${p.opacity})`;
        
        if (!isMobile) {
          ctx.shadowBlur = 6;
          ctx.shadowColor = 'rgba(255, 120, 0, 0.7)';
        }
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
